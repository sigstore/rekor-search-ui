name: 🐶 reviewdog

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: "package.json"
      - uses: reviewdog/action-eslint@556a3fdaf8b4201d4d74d406013386aa4f7dab96 # v1.34.0
        with:
          reporter: github-check
          eslint_flags: "src/"

  action-lint:
    name: Action lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Find yamls
        id: get_yamls
        run: |
          yamls=$(find .github -name "*.y*ml" | grep -v dependabot. | tr '\n' ' ')
          echo "files=${yamls}" >> "$GITHUB_OUTPUT"
      - name: Action lint
        uses: reviewdog/action-actionlint@e58ee9d111489c31395fbe4857b0be6e7635dbda # v1.70.0
        with:
          actionlint_flags: ${{ steps.get_yamls.outputs.files }}

  spacing:
    name: Spacing
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: chainguard-dev/actions/trailing-space@fac81f8edade777ac0bedfa9f4a42591accab9c8 # v1.5.14
      - uses: chainguard-dev/actions/eof-newline@fac81f8edade777ac0bedfa9f4a42591accab9c8 # v1.5.14

  donotsubmit:
    name: Do not submit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: chainguard-dev/actions/donotsubmit@fac81f8edade777ac0bedfa9f4a42591accab9c8 # v1.5.14
